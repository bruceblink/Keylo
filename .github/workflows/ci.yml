name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'audit.toml'
      - 'scripts/*.ps1'
      - 'scripts/*.sh'
      - 'scripts/*.py'
      - 'web/src/**'
      - 'web/index.html'
      - 'web/*.json'
      - 'web/*.ts'
      - 'examples/go-net-http-oidc/*.go'
      - 'examples/go-net-http-oidc/go.mod'
      - 'examples/go-net-http-oidc/go.sum'
      - 'examples/node-express-oidc/*.mjs'
      - 'examples/node-express-oidc/package.json'
      - 'examples/node-express-oidc/package-lock.json'
      - 'examples/rust-axum-oidc/src/**'
      - 'examples/rust-axum-oidc/Cargo.toml'
      - 'examples/rust-axum-oidc/Cargo.lock'
      - 'examples/spring-boot-oidc/src/**'
      - 'examples/spring-boot-oidc/build.gradle'
      - 'examples/spring-boot-oidc/settings.gradle'
      - 'examples/spring-boot-oidc/gradlew*'
      - 'examples/spring-boot-resource-server/src/**'
      - 'examples/spring-boot-resource-server/build.gradle'
      - 'examples/spring-boot-resource-server/settings.gradle'
      - 'examples/spring-boot-resource-server/gradlew*'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'audit.toml'
      - 'scripts/*.ps1'
      - 'scripts/*.sh'
      - 'scripts/*.py'
      - 'web/src/**'
      - 'web/index.html'
      - 'web/*.json'
      - 'web/*.ts'
      - 'examples/go-net-http-oidc/*.go'
      - 'examples/go-net-http-oidc/go.mod'
      - 'examples/go-net-http-oidc/go.sum'
      - 'examples/node-express-oidc/*.mjs'
      - 'examples/node-express-oidc/package.json'
      - 'examples/node-express-oidc/package-lock.json'
      - 'examples/rust-axum-oidc/src/**'
      - 'examples/rust-axum-oidc/Cargo.toml'
      - 'examples/rust-axum-oidc/Cargo.lock'
      - 'examples/spring-boot-oidc/src/**'
      - 'examples/spring-boot-oidc/build.gradle'
      - 'examples/spring-boot-oidc/settings.gradle'
      - 'examples/spring-boot-oidc/gradlew*'
      - 'examples/spring-boot-resource-server/src/**'
      - 'examples/spring-boot-resource-server/build.gradle'
      - 'examples/spring-boot-resource-server/settings.gradle'
      - 'examples/spring-boot-resource-server/gradlew*'

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:password@localhost:5432/keylo_test
  TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/keylo_test
  SMTP_TEST_HOST: 127.0.0.1
  SMTP_TEST_PORT: 1025
  SMTP_TEST_API_URL: http://127.0.0.1:8025/api/v1/messages

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: keylo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - 1025:1025
          - 8025:8025

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Validate Markdown relative links
      shell: pwsh
      run: ./scripts/check_markdown_links.ps1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          web/package-lock.json
          examples/node-express-oidc/package-lock.json

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: examples/go-net-http-oidc/go.mod
        cache-dependency-path: examples/go-net-http-oidc/go.sum

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check code formatting
      run: cargo fmt --all -- --check

    - name: Build setup web UI
      working-directory: web
      run: |
        npm ci
        npm run build

    - name: Wait for Postgres
      env:
        PGPASSWORD: password
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for postgres..."
          sleep 1
        done

    - name: Verify PostgreSQL version
      env:
        PGPASSWORD: password
      run: |
        psql -h localhost -U postgres -d keylo_test -v ON_ERROR_STOP=1 -c "SHOW server_version;"

    - name: Run clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Run unit tests
      run: cargo test --lib -- --test-threads=1

    - name: Run integration tests
      run: cargo test --test integration_test -- --test-threads=1

    - name: Run user integration tests
      run: cargo test --test user_integration_test -- --test-threads=1

    - name: Run SMTP integration tests
      run: cargo test --test smtp_integration_test -- --test-threads=1

    - name: Run RBAC integration tests
      run: cargo test --test rbac_integration_test -- --test-threads=1

    - name: Run OAuth integration tests
      run: cargo test --test oauth_integration_test -- --test-threads=1

    - name: Run database integration tests
      run: cargo test --test database_integration_test -- --test-threads=1

    - name: Run load tests
      run: cargo test --test load_test -- --test-threads=1

    - name: Validate OIDC relying party examples
      run: |
        cd examples/node-express-oidc
        npm ci --ignore-scripts
        npm run check
        cd ../go-net-http-oidc
        go test ./...
        cd ../rust-axum-oidc
        cargo test
        cd ../spring-boot-oidc
        chmod +x gradlew
        ./gradlew test --no-daemon

    - name: Build release binary
      run: cargo build --release

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit --ignore RUSTSEC-2023-0071

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      RUST_TEST_THREADS: 1

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: keylo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - 1025:1025
          - 8025:8025

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-tarpaulin
      run: cargo install cargo-tarpaulin

    - name: Wait for Postgres
      env:
        PGPASSWORD: password
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for postgres..."
          sleep 1
        done

    - name: Verify PostgreSQL version
      env:
        PGPASSWORD: password
      run: |
        psql -h localhost -U postgres -d keylo_test -v ON_ERROR_STOP=1 -c "SHOW server_version;"

    - name: Run tests with coverage
      run: cargo tarpaulin --out Xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: cobertura.xml
        fail_ci_if_error: false
