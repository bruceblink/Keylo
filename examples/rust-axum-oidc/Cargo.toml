[package]
name = "keylo-rust-axum-oidc-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
openidconnect = "4.0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-sessions = "0.15.0"
